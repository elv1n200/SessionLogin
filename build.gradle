plugins {
	// 26.x is unobfuscated: no remapping and no mappings dependency, so the
	// plain loom plugin (not -remap) is the right one here.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

// Put the Minecraft version in the jar name so a launcher can tell 26.x builds
// apart from other-version builds by filename (matches the title-screen mod's
// `<id>-<mc>-<version>.jar` convention).
base {
	archivesName = "sessionlogin-${project.minecraft_version}"
}

repositories {
	maven {
		name = 'Terraformers'
		url = 'https://maven.terraformersmc.com/'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// 26.x ships unobfuscated → the game already has Mojang names, so Loom
	// needs no mappings dependency (and rejects one).
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Bundled inside the mod jar (Jar-in-Jar) so reading Modrinth App's
	// SQLite account DB works out of the box.
	include "org.xerial:sqlite-jdbc:3.46.1.3"
	implementation "org.xerial:sqlite-jdbc:3.46.1.3"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
